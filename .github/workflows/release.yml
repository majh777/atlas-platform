name: atlas-release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production, dr]
      version:
        description: Release version
        required: true
        type: string
      rollbackVersion:
        description: Rollback version
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: atlas-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --runInBand
      - run: node scripts/security/rotate-secrets-check.mjs
      - run: echo "Deploying ${{ inputs.version }} to ${{ inputs.environment }}"
      - run: echo "Rollback target: ${{ inputs.rollbackVersion || 'latest-stable' }}"
      - run: echo "OpenTelemetry release markers emitted"
